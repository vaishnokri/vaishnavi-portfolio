<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1218"/>
      <stop offset="50%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#1A202E"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <pattern id="guilloche" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 0 40 Q 20 0 40 40 T 80 40" fill="none" stroke="#8B85FF" stroke-width="0.75" stroke-opacity="0.07"/>
      <path d="M 0 20 Q 20 60 40 20 T 80 20" fill="none" stroke="#8B85FF" stroke-width="0.75" stroke-opacity="0.05"/>
      <path d="M 0 60 Q 20 20 40 60 T 80 60" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>

    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <path id="stampTextPath" d="M 955 315 m -100,0 a 100,100 0 1,1 200,0 a 100,100 0 1,1 -200,0" fill="none"/>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#guilloche)"/>

  <!-- Border Security Frames -->
  <rect x="26" y="26" width="1148" height="578" rx="18" fill="none" stroke="#252C3D" stroke-width="2"/>
  <rect x="38" y="38" width="1124" height="554" rx="12" fill="none" stroke="#8B85FF" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="6 4"/>

  <!-- Corner Registry Crosshairs -->
  <g stroke="#8B85FF" stroke-width="1.5" stroke-opacity="0.6">
    <path d="M 52 44 L 52 64 M 42 54 L 62 54"/>
    <path d="M 1148 44 L 1148 64 M 1138 54 L 1158 54"/>
    <path d="M 52 566 L 52 586 M 42 576 L 62 576"/>
    <path d="M 1148 566 L 1148 586 M 1138 576 L 1158 576"/>
  </g>

  <!-- Topbar Header Band -->
  <g class="mono">
    <text x="70" y="82" font-size="13" font-weight="600" letter-spacing="3" fill="#8C95A8">PASSPORT / PASSEPORT</text>
    <text x="600" y="82" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="5" fill="url(#goldGrad)">REPUBLIC OF CODE</text>
    <text x="1130" y="82" text-anchor="end" font-size="13" font-weight="600" letter-spacing="2" fill="#8C95A8">NO. VK-2026-DEV</text>
  </g>
  <line x1="68" y1="104" x2="1132" y2="104" stroke="#252C3D" stroke-width="1.5"/>

  <!-- Main Information Block -->
  <!-- Eyebrow -->
  <g class="mono">
    <rect x="70" y="142" width="170" height="26" rx="4" fill="#2E2856" stroke="#5E53B7" stroke-width="1"/>
    <text x="155" y="159" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2.5" fill="#C4B5FD">OFFICIAL PROFILE</text>
  </g>

  <!-- Name -->
  <text x="70" y="236" class="sans" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">Vaishnavi Kumari</text>

  <!-- Role -->
  <text x="72" y="286" class="sans" font-size="25" font-weight="600" letter-spacing="-0.5" fill="url(#violetGrad)">Frontend Developer · UI Engineer</text>

  <!-- Description -->
  <text x="72" y="340" class="sans" font-size="19" font-weight="400" fill="#9AA2B6">
    Crafting performant, accessible web interfaces &amp; scalable design systems.
  </text>
  <text x="72" y="370" class="sans" font-size="18" font-weight="400" fill="#717A8F">
    Passport-themed developer portfolio · Clean code · Fluid interactions
  </text>

  <!-- Badges / Skill Stamps -->
  <g class="mono" font-size="12" font-weight="600" letter-spacing="1">
    <!-- Badge 1 -->
    <rect x="72" y="416" width="102" height="32" rx="6" fill="#181D2A" stroke="#363E52" stroke-width="1.2"/>
    <text x="123" y="437" text-anchor="middle" fill="#CBD5E1">HTML5 / CSS3</text>

    <!-- Badge 2 -->
    <rect x="186" y="416" width="102" height="32" rx="6" fill="#181D2A" stroke="#363E52" stroke-width="1.2"/>
    <text x="237" y="437" text-anchor="middle" fill="#CBD5E1">JAVASCRIPT</text>

    <!-- Badge 3 -->
    <rect x="300" y="416" width="126" height="32" rx="6" fill="#181D2A" stroke="#363E52" stroke-width="1.2"/>
    <text x="363" y="437" text-anchor="middle" fill="#CBD5E1">DESIGN SYSTEMS</text>

    <!-- Badge 4 -->
    <rect x="438" y="416" width="120" height="32" rx="6" fill="#181D2A" stroke="#363E52" stroke-width="1.2"/>
    <text x="498" y="437" text-anchor="middle" fill="#CBD5E1">PERFORMANCE</text>

    <!-- Badge 5 -->
    <rect x="570" y="416" width="94" height="32" rx="6" fill="#181D2A" stroke="#363E52" stroke-width="1.2"/>
    <text x="617" y="437" text-anchor="middle" fill="#CBD5E1">WEB A11Y</text>
  </g>

  <!-- Right Side: Official Passport Stamp & Clearance Seal -->
  <g transform="rotate(-6 955 285)" filter="url(#stampShadow)">
    <!-- Circular Passport Stamp -->
    <circle cx="955" cy="285" r="126" stroke="#4C3F99" stroke-width="3" fill="#151824" fill-opacity="0.9"/>
    <circle cx="955" cy="285" r="118" stroke="#8B85FF" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
    <circle cx="955" cy="285" r="76" stroke="#4C3F99" stroke-width="1.5" fill="none"/>

    <!-- Circular Ring Text -->
    <text class="mono" font-size="10.5" font-weight="700" letter-spacing="3.2" fill="#A78BFA">
      <textPath href="#stampTextPath" startOffset="50%" text-anchor="middle">
        ★ DEVELOPER PASSPORT ★ ENTRY APPROVED ★
      </textPath>
    </text>

    <!-- Monogram Inside Stamp -->
    <text x="946" y="296" text-anchor="middle" class="sans" font-size="52" font-weight="800" letter-spacing="-1" fill="#FFFFFF">VK</text>
    <circle cx="986" cy="282" r="5.5" fill="#8B85FF"/>
    <text x="955" y="324" text-anchor="middle" class="mono" font-size="10" font-weight="700" letter-spacing="2" fill="#9CA3AF">INDIA · 2026</text>
  </g>

  <!-- Visa Approval Stamp Box (Bottom Right) -->
  <g transform="rotate(3 960 442)">
    <rect x="836" y="420" width="248" height="44" rx="6" fill="#0E2318" stroke="#22C55E" stroke-width="1.8"/>
    <text x="960" y="447" text-anchor="middle" class="mono" font-size="12" font-weight="700" letter-spacing="2.5" fill="#4ADE80">
      CLEARED FOR WORK · 2026
    </text>
  </g>

  <!-- Bottom Machine Readable Zone (MRZ) Strip -->
  <rect x="40" y="492" width="1120" height="96" rx="8" fill="#0B0D12" stroke="#1F2533" stroke-width="1.5"/>
  <g class="mono" font-size="18.5" font-weight="500" letter-spacing="4.2" fill="#6B7280">
    <text x="70" y="532">P&lt;INDKUMARI&lt;&lt;VAISHNAVI&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
    <text x="70" y="566">VK2026DEV8IND0304052F2609115&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;08</text>
  </g>
</svg>
