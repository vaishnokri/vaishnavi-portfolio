<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --bg: #EDEFF3;
      --ring: #362F78;
      --text: #14171F;
      --dot: #362F78;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11141A;
        --ring: #8B85FF;
        --text: #EDEFF3;
        --dot: #8B85FF;
      }
    }
    .bg { fill: var(--bg); }
    .ring { stroke: var(--ring); fill: none; }
    .text { fill: var(--text); font-family: "Space Grotesk", system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 23px; letter-spacing: -0.04em; }
    .dot { fill: var(--dot); }
  </style>
  <rect width="64" height="64" rx="14" class="bg"/>
  <circle cx="32" cy="32" r="27" class="ring" stroke-width="2"/>
  <circle cx="32" cy="32" r="23" class="ring" stroke-width="1" stroke-opacity="0.55" stroke-dasharray="3 2"/>
  <text x="29" y="39.5" text-anchor="middle" class="text">VK</text>
  <circle cx="45" cy="34.5" r="2.5" class="dot"/>
</svg>
